# Configuracion del sistema DSM. Todos los nodos deben usar el mismo archivo:
# al unirse se compara su hash y el ingreso se rechaza si no coincide.

[memoria]
tam_pagina        = 4096            # multiplo del tamano de pagina del sistema
memoria_por_nodo  = 64M             # capacidad que cada nodo aporta como hogar
cache_remota      = 64M             # copias de paginas de otros hogares antes de desalojar
reemplazo         = reloj           # fifo o reloj (segunda oportunidad)
base_global       = 0x600000000000  # misma direccion virtual en todos los nodos
ventana_por_nodo  = 4G              # espacio virtual donde cada nodo crea segmentos
politica_defecto  = repartida       # local_primero o repartida
bloque_reparto    = 16              # paginas seguidas por nodo en la politica repartida

[red]
puerto_minimo     = 27500           # rango asignado a la pareja
puerto_maximo     = 27599           # el nodo k escucha en puerto_minimo + 2k
semilla           = 127.0.0.1:27500 # cualquier nodo del cluster (se puede repetir la clave);
                                    # si no es el coordinador, responde con su direccion
socket_local      = /tmp/dsm-27500-%d.sock

[hilos]
hilos_trabajadores = 4
tam_cola_mensajes  = 1024

[tiempos]                           # en milisegundos
intervalo_latido  = 500
sospecha_tras     = 1500            # sin mensajes: el nodo se marca sospechoso
caida_tras        = 3000            # sin mensajes: el nodo se da por caido
plazo_peticion    = 2000
